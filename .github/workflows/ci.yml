name: Homebrew

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Homebrew (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # brew test, style and audit otherwise download Homebrew's gem groups on every run.
      # The key pins the exact Homebrew commit, so an image update starts a fresh bundle;
      # brew still runs `bundle check` and repairs anything missing.
      - name: Locate Homebrew's gem bundle
        id: gems
        shell: bash
        run: |
          set -euo pipefail
          library="$(brew --repository)/Library/Homebrew"
          commit="$(git -C "$library" rev-parse HEAD)"
          lock="$(shasum -a 256 "$library/Gemfile.lock" | cut -d ' ' -f 1)"
          printf 'path=%s\nkey=homebrew-gems-%s-%s-%s-%s\n' "$library/vendor/bundle/ruby" \
            "$RUNNER_OS" "$RUNNER_ARCH" "$commit" "$lock" >> "$GITHUB_OUTPUT"
      - name: Restore Homebrew's gem bundle
        id: restore-gems
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gems.outputs.path }}
          key: ${{ steps.gems.outputs.key }}
      - name: Install this checkout as a tap
        run: brew tap --custom-remote syz51/tap "$GITHUB_WORKSPACE"
      - name: Trust the reviewed formula when supported
        run: |
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula syz51/tap/codex-commit
          fi
      - name: Install published native release
        run: brew install syz51/tap/codex-commit
      - name: Test installed command
        run: brew test syz51/tap/codex-commit
      - name: Check formula style
        run: brew style syz51/tap/codex-commit
      - name: Audit formula
        run: brew audit --strict --online syz51/tap/codex-commit
      - name: Save Homebrew's gem bundle from main
        if: github.ref == 'refs/heads/main' && steps.restore-gems.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gems.outputs.path }}
          key: ${{ steps.gems.outputs.key }}
