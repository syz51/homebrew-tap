name: Homebrew

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Homebrew (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # brew test, style and audit otherwise download Homebrew's gem groups on every run.
      # The key pins the exact Homebrew commit, so an image update starts a fresh bundle;
      # brew still runs `bundle check` and repairs anything missing.
      - name: Locate Homebrew's gem bundle
        id: gems
        shell: bash
        run: |
          set -euo pipefail
          library="$(brew --repository)/Library/Homebrew"
          commit="$(git -C "$library" rev-parse HEAD)"
          lock="$(shasum -a 256 "$library/Gemfile.lock" | cut -d ' ' -f 1)"
          printf 'path=%s\nkey=homebrew-gems-%s-%s-%s-%s\n' "$library/vendor/bundle/ruby" \
            "$RUNNER_OS" "$RUNNER_ARCH" "$commit" "$lock" >> "$GITHUB_OUTPUT"
      - name: Restore Homebrew's gem bundle
        id: restore-gems
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gems.outputs.path }}
          key: ${{ steps.gems.outputs.key }}
      - name: Verify agent-desktop formula renderer consistency
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/render-agent-desktop.sh
          version="$(sed -nE 's@.*releases/download/v([0-9]+\.[0-9]+\.[0-9]+)/.*@\1@p' Formula/agent-desktop.rb | sort -u)"
          awk '
            /url "/ {
              file = $0
              sub(/^.*\//, "", file)
              sub(/".*$/, "", file)
            }
            /sha256 "/ {
              sha = $0
              sub(/^.*sha256 "/, "", sha)
              sub(/".*$/, "", sha)
              print sha "  " file
            }
          ' Formula/agent-desktop.rb > "$RUNNER_TEMP/agent-desktop.SHA256SUMS"
          bash scripts/render-agent-desktop.sh \
            --version "$version" \
            --checksums "$RUNNER_TEMP/agent-desktop.SHA256SUMS" \
            --output "$RUNNER_TEMP/agent-desktop.rb"
          diff -u Formula/agent-desktop.rb "$RUNNER_TEMP/agent-desktop.rb"
      - name: Install this checkout as a tap
        run: brew tap --custom-remote syz51/tap "$GITHUB_WORKSPACE"
      - name: Trust the reviewed formulae when supported
        shell: bash
        run: |
          set -euo pipefail
          if brew help trust >/dev/null 2>&1; then
            for formula in Formula/*.rb; do
              name="$(basename "$formula" .rb)"
              brew trust --formula "syz51/tap/$name"
            done
          fi
      - name: Install, test, style, and audit formulae
        shell: bash
        run: |
          set -euo pipefail
          for formula in Formula/*.rb; do
            name="$(basename "$formula" .rb)"
            echo "::group::Formula syz51/tap/$name"
            brew install "syz51/tap/$name"
            brew test "syz51/tap/$name"
            brew style "syz51/tap/$name"
            brew audit --strict --online "syz51/tap/$name"
            echo "::endgroup::"
          done
      - name: Save Homebrew's gem bundle from main
        if: github.ref == 'refs/heads/main' && steps.restore-gems.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gems.outputs.path }}
          key: ${{ steps.gems.outputs.key }}
